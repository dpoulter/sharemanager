; php-fpm pool for sharemanager.
;
;   sudo cp deploy/php-fpm-pool.conf /etc/php/8.3/fpm/pool.d/sharemanager.conf
;   sudo chmod 640 /etc/php/8.3/fpm/pool.d/sharemanager.conf
;   sudo systemctl restart php8.3-fpm
;
; The database password lives here rather than in includes/constants.php,
; which is tracked in git. constants.php reads the environment first, so
; nothing secret ends up in a file git can see or a diff you might push.
;
; Then set the socket in the Caddyfile to /run/php/sharemanager.sock.

[sharemanager]
user = www-data
group = www-data
listen = /run/php/sharemanager.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; --- application settings -------------------------------------------------
env[SM_DB_NAME] = sharemanager
env[SM_DB_HOST] = 127.0.0.1
env[SM_DB_USER] = shares
env[SM_DB_PASS] = CHANGE-ME
env[SM_SITE_URL] = https://sharemanager.advancepost.net

; The EODHD key, if you have one. Empty is the supported "no live quotes" state.
env[EODHD_API_KEY] =

; SM_DISPLAY_ERRORS is deliberately absent. Setting it to 1 puts filesystem
; paths and query fragments on the page for anyone who can reach the site.

; --- hardening ------------------------------------------------------------
php_admin_value[error_log] = /var/log/php/sharemanager-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[expose_php] = off

; Nothing here writes outside the application directory or /tmp.
php_admin_value[open_basedir] = /var/www/sharemanager:/tmp:/usr/share/php
; PHPMailer uses popen for the sendmail transport only, and this application
; calls isSMTP(), so nothing served needs any of these. Drop popen from the list
; if you ever switch the mailer to sendmail.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

php_value[session.cookie_httponly] = 1
php_value[session.cookie_secure] = 1
php_value[session.cookie_samesite] = Lax
php_value[session.use_strict_mode] = 1
