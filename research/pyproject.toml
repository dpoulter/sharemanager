[project]
name = "research"
version = "0.1.0"
description = "Backtest research for UK shares: FMP data, point-in-time universe, fast engine, honest test log."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.scripts]
research = "research.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
