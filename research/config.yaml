# Settings for the research setup. Paths may start with ~.
# Every value here can be read back from the log: the run records the
# config file's hash alongside the strategy's.

paths:
  data: ~/sharemanager-research/data
  reports: ~/sharemanager-research/reports
  logs: ~/sharemanager-research/logs
  env_file: ~/.config/sharemanager-research/env
  # Relative to the research/ folder.
  run_log: log/runs.parquet

fmp:
  base_url: https://financialmodelingprep.com/stable
  # Premium is 750 a minute; stay under it.
  calls_per_minute: 600
  # Calls in flight at once. Each takes about a second, so 600 a minute needs
  # ten or more; the limit above still caps the rate whatever this is.
  concurrency: 16
  max_retries: 6
  # Price history from this date where FMP has it.
  price_start: "1988-01-01"
  market_cap_start: "2007-01-01"
  # Rows per price call is capped at 5,000; 15 years of trading days is ~3,800.
  price_chunk_years: 15
  # The nightly top-up (fetch.py). Statements are read again when FMP's list of
  # the latest filings names the company, and otherwise once in this many days,
  # spread over the nights; each company's own dividend list likewise (the
  # dividend calendar is read every night).
  statements_refresh_days: 7
  dividends_refresh_days: 7
  # Symbols in one batch-quote or market-capitalization-batch call. Jarvis: run
  # `uv run research batch-size` on the Mac mini (it tries larger and larger
  # calls with the real key) and put the largest that works here. 50 is a size
  # known to be safe, not the largest.
  batch_symbols: 50

point_in_time:
  # FMP's filingDate for UK companies is the period end, not the publication
  # date, so a statement is only usable this long after its period end.
  annual_lag_months: 4
  half_year_lag_months: 3

engine:
  # adjusted: signals, averages, fills and valuations on the dividend-adjusted
  # close (total return). raw: on the raw close, no dividends credited, as the
  # N100 prices. Research runs use adjusted; validate uses raw.
  price_basis: adjusted

universe:
  size: 350
  large_size: 100            # FTSE 100-like = top 100, FTSE 250-like = 101..350
  start: "2007-01-01"        # market cap history starts here; nothing before it
  include_aim: false
  # Rank like the FTSE 350: the top `size` by market cap WITH investment trusts
  # and funds counted, then drop them (about 260 companies, as the FTSE 350
  # has). False ranks companies only, which reaches about 90 places deeper.
  rank_with_trusts: true
  # Optional CSV of AIM symbols (one column, symbol) where FMP does not say.
  aim_list: null

periods:
  # Validation starts in 2023, not 2022: the pulled data has dead London
  # lines only from 2023 (2021: 1, 2022: 13, 2023: 141). Dale's call; to go
  # back, set dev to end 2021-12-31 and val to start 2022-01-01.
  dev: ["2007-01-01", "2022-12-31"]
  val: ["2023-01-01", "2025-05-17"]
  holdout_start: "2025-05-18"

caveats:
  - "Restatements: FMP holds the latest figures, not those first published, so accounts-based signals may see corrections made later."
  - "Accounts are lagged from period end (4 months annual, 3 months half-year) because FMP's UK filing dates are period ends."
  - "Development period (2007-2022) is survivorship-biased: the data holds few companies that died before 2023."

price_clean:
  # src/research/price_clean.py. A big move: a daily rise over `rise` or a fall over `fall`.
  rise: 1.0
  fall: 0.67
  # A pence and pounds step: a one-day ratio between factor_lo and factor_hi (or its inverse).
  # The brief started at 80 to 120; Lookers' January 2008 step came with a real fall the same day
  # (115p to ~87p, read as 8,700p: a ratio of 75.7), so 50 to 200.
  factor_lo: 50
  factor_hi: 200
  spike_back: 0.25        # rule 2: the next day back within 25% of the day before the spike
  adj_tolerance: 0.5      # rule 3: adj more than 1.5 times off the value rebuilt from raw and dividends
  revert_sessions: 20     # rule 4: a move that comes back within 20 sessions ...
  revert_within: 0.5      # ... to within 50% of the price before it is unusable for those dates
  # Dale's decisions; relative to research/. Omit for price_overrides.yaml.
  # overrides: price_overrides.yaml

indicators:
  # Piotroski F-score (indicators/piotroski.py). Test 7, no new equity: the
  # weighted average shares may grow this much (scrip, options) and still pass.
  # A company with more missing tests than max_missing_tests has no score.
  piotroski_score:
    share_issue_tolerance: 0.005
    max_missing_tests: 2
